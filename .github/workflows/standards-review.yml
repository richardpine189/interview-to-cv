name: Standards review reminder

# Opens an issue every 6 months (1 January and 1 July) reminding maintainers
# to re-verify market rules, credential-recognition bodies and official links.
on:
  schedule:
    - cron: "0 9 1 1,7 *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-review-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open review issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Semi-annual standards review (${today})`,
              labels: ["standards-review"],
              body: [
                "Time to re-verify the skill's market knowledge. For each file, check the sources and update `last_verified`.",
                "",
                "- [ ] `markets/*.md` — CV conventions (length, photo, personal data, sections)",
                "- [ ] `credential_recognition` blocks — organisations, official links, validity",
                "- [ ] `references/` — occupation and education classifications (versions, URLs)",
                "- [ ] Export formats — Europass import format, ATS guidance",
                "- [ ] `locales/*/generic-phrases.md` — add newly overused phrases",
              ].join("\n"),
            });
